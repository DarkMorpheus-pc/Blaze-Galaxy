# BlazeOS Kernel and Virtual Memory Tuning (SolarEvolution 5.05)
# Optimized for ZRAM swap, high-throughput desktop rendering, gaming, and responsive multitasking.

# ZRAM Optimization
# Aggressively utilize compressed RAM swap instead of early out-of-memory killing
vm.swappiness = 150
vm.page-cluster = 0
vm.vfs_cache_pressure = 50

# Gaming, Wine / Proton compatibility (avoid crashing memory-mapped assets)
vm.max_map_count = 2147483642

# Memory writeback and dirty page control
vm.dirty_background_ratio = 5
vm.dirty_ratio = 10

# Security and kernel hardening parameters audited by Blaze Sentinel
kernel.kptr_restrict = 1
kernel.dmesg_restrict = 1
kernel.unprivileged_bpf_disabled = 1
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1

# File descriptor capacity for massive asset compilation / modern gaming engines
fs.file-max = 2097152
