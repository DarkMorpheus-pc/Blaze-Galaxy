# ========================================================
# BlazeOS Modern Kitty Configuration
# ========================================================

# Font Configuration
font_family      JetBrains Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.5

# Window Layout & Padding
window_padding_width 12
confirm_os_window_close 0
remember_window_size  yes
initial_window_width  860
initial_window_height 540

# Window Appearance & Blur
background_opacity 0.88
background_blur 32
hide_window_decorations yes

# Mouse & Cursor
cursor_shape beam
cursor_beam_thickness 1.5
cursor_blink_interval 0.5
mouse_hide_wait 3.0
enable_audio_bell no

# Colors (Catppuccin Mocha / Blaze Solar Accent)
foreground              #CDD6F4
background              #131317
selection_foreground    #131317
selection_background    #F5E0DC

# Cursor colors
cursor                  #F5E0DC
cursor_text_color       #131317

# URL underline color when hovering with mouse
url_color               #F5E0DC

# Kitty window border colors
active_border_color     #FF6600
inactive_border_color   #31282A
bell_border_color       #F9E2AF

# OS Window titlebar colors
wayland_titlebar_color  system
macos_titlebar_color    system

# Tab bar colors
active_tab_foreground   #131317
active_tab_background   #FF6600
inactive_tab_foreground #CDD6F4
inactive_tab_background #181825
tab_bar_background      #11111B

# The 16 terminal colors
